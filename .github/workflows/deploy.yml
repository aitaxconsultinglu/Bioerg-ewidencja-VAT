name: Deploy do GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalacja zależności
        run: npm ci

      - name: Budowanie aplikacji
        # Adres projektu i klucz publishable są wpisane w src/lib/config.ts (klucz jest
        # z założenia jawny - dostępu pilnuje RLS). Zmienne poniżej pozwalają nadpisać
        # je bez zmiany kodu, np. gdyby projekt Supabase został przeniesiony.
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Konfiguracja GitHub Pages
        uses: actions/configure-pages@v5

      - name: Przygotowanie plików do publikacji
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Publikacja
        id: deployment
        uses: actions/deploy-pages@v4
